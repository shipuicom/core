name: Build and Deploy Angular Library

on:
  push:
    branches:
      - main # Or your main branch name
  # manual trigger — e.g. to re-run a deploy missed during a GitHub Actions outage
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # shallow clone

      - name: Deepen Clone
        run: git fetch --unshallow

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Publish when the library's version is not on npm yet, rather than when the head commit touched package.json:
      # that misses rebase merges, a release whose build failed and was fixed in a later commit, and manual re-runs.
      - name: Check whether this version is published
        id: check_package_json_change
        run: |
          name=$(node -p "require('./projects/ship-ui/package.json').name")
          version=$(node -p "require('./projects/ship-ui/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            changed="false"
          else
            echo "$name@$version is not on npm yet; building and publishing."
            changed="true"
          fi
          echo "changed=$changed" >> $GITHUB_ENV

      # The release must not ship rules that rewrite names consumers never had, nor miss a rename they do have.
      - name: Check structure and migration rules
        if: env.changed == 'true' && github.ref == 'refs/heads/main'
        run: bun run lint:structure && bun run lint:migration

      - name: Build Library
        if: env.changed == 'true' && github.ref == 'refs/heads/main'
        run: bun run build:prod

      - name: Publish (version not on npm yet)
        if: env.changed == 'true' && github.ref == 'refs/heads/main'
        working-directory: ./dist/ship-ui
        run: npm publish --access public
