name: Build and Deploy Angular Library

on:
  push:
    branches:
      - main # Or your main branch name
  # manual trigger — e.g. to re-run a deploy missed during a GitHub Actions outage
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # shallow clone

      - name: Deepen Clone
        run: git fetch --unshallow

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check if package.json was modified
        id: check_package_json_change
        run: |
          if git rev-list --count HEAD > 1; then 
            changed=$(if git diff --name-only HEAD^ HEAD | grep 'projects/ship-ui/package.json' >/dev/null; then echo 'true'; else echo 'false'; fi)
          else
            changed="false"
          fi

          # Write the output to the environment file
          echo "changed=$changed" >> $GITHUB_ENV

      # The release must not ship rules that rewrite names consumers never had, nor miss a rename they do have.
      - name: Check structure and migration rules
        if: env.changed == 'true' && github.ref == 'refs/heads/main'
        run: bun run lint:structure && bun run lint:migration

      - name: Build Library
        if: env.changed == 'true' && github.ref == 'refs/heads/main'
        run: bun run build:prod

      - name: Publish (if package.json changed)
        if: env.changed == 'true' && github.ref == 'refs/heads/main'
        working-directory: ./dist/ship-ui
        run: npm publish --access public
