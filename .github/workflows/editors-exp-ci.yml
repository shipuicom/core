name: editors-exp CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/ship-ui/ship-editor/**'
      - 'projects/design-system/src/app/ship/editors/**'
      - 'scripts/editor-e2e/**'
      - '.github/workflows/editors-exp-ci.yml'
  pull_request:
    paths:
      - 'projects/ship-ui/ship-editor/**'
      - 'projects/design-system/src/app/ship/editors/**'
      - 'scripts/editor-e2e/**'
      - '.github/workflows/editors-exp-ci.yml'
  schedule:
    # Nightly deep fuzz — same seeds ×10 iterations (FUZZ_SCALE).
    - cron: '17 3 * * *'

concurrency:
  group: editors-exp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Unit + integration + fuzz (fast, seeded — runs on every change)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Editor Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # ng test, not bare vitest: the component specs import path-mapped
      # subpackages (@ship-ui/core/*) that only the Angular builder resolves.
      - name: Run editor suite
        run: npx ng test ship-ui --watch=false

  # ──────────────────────────────────────────────────────────────────────────
  # Typecheck — vitest transpiles without type-checking, so type errors only
  # surface at build time (a mis-typed selection mapper shipped green tests).
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (ng build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build design-system (development)
        run: npx ng build design-system --configuration development

  # ──────────────────────────────────────────────────────────────────────────
  # E2E — the DOM ≡ AST invariant under real Chromium input (keyboard storms,
  # shortcuts, CDP-driven IME composition). Playwright boots ng serve itself.
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: Editor E2E (Playwright)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # index.html links /ship.css, which the font generator writes into the
      # (gitignored) public dir. Without it the dev server 404s the
      # stylesheet and every spec fails its console-error assertion.
      - name: Generate ship.css
        run: bun run gen:font

      - name: Run editor e2e suite
        run: npx playwright test -c scripts/editor-e2e/playwright.config.ts

  # ──────────────────────────────────────────────────────────────────────────
  # Nightly deep fuzz — identical suite, 10× the seeds
  # ──────────────────────────────────────────────────────────────────────────
  fuzz-deep:
    name: Deep Fuzz (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run rebase fuzz at 10x scale
        env:
          FUZZ_SCALE: '10'
        run: npx ng test ship-ui --watch=false --include='**/editor-rebase-fuzz.spec.ts'
