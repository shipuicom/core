@if (content(); as source) {
  <pre><code [class]="langClass()" #codeRef>{{ source }}</code></pre>
} @else {
  <pre><code #codeRef class="missing-source">No {{ lang() }} source for this example.</code></pre>
}

<button shButton aria-label="Copy code" class="small simple" [class.error]="!copied()" [class.success]="copied()" (click)="copyToClipboard()">
  @if (copied()) {
    <sh-icon>check</sh-icon>
  } @else {
    <sh-icon>copy</sh-icon>
  }
</button>
