<!-- Every composable control, in flex order. Cast/AirPlay render only when the
     browser has a castable device / wireless target available. -->
<!-- no poster: the featured image is a video frame ([firstFrame] time,
     explicit because blender.org media is not CORS-readable for auto-scoring) -->
<sh-video color="accent" [firstFrame]="30" [sources]="sources" [tracks]="tracks">
  <sh-video-controls>
    <sh-video-scrubber />

    <sh-video-play-button />
    <sh-video-volume />
    <sh-video-time />
    <!-- X-style countdown alternative to sh-video-time -->
    <sh-video-playtime-left />

    <span class="sh-video-spacer"></span>

    <sh-video-captions-button />
    <sh-video-settings />
    <sh-video-cast-button />
    <sh-video-airplay-button />
    <sh-video-pip-button />
    <sh-video-fullscreen-button />
  </sh-video-controls>
</sh-video>
