<div class="sandbox-example">
  <app-previewer path="/buttons/examples/button-sandbox/button-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-button-group class="small" [(value)]="size">
        <button value="">Normal</button>
        <button value="small">Small</button>
        <button value="xsmall">XSmall</button>
      </sh-button-group>

      <sh-button-group class="small" [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-button-group class="small" [(value)]="variant">
        <button value="">Default</button>
        <button value="simple">Simple</button>
        <button value="outlined">Outlined</button>
        <button value="flat" [disabled]="noBg()">Flat</button>
        <button value="raised" [disabled]="noBg()">Raised</button>
      </sh-button-group>

      <sh-toggle [(checked)]="rotated" color="primary" variant="raised">Rotated</sh-toggle>
      <sh-toggle [(checked)]="loading" color="primary" variant="raised">Loading</sh-toggle>
      <sh-toggle [(checked)]="disabled" color="primary" variant="raised">Disabled</sh-toggle>
      <sh-toggle [(checked)]="readonly" color="primary" variant="raised">Readonly</sh-toggle>
      <sh-toggle [(checked)]="noBg" color="primary" variant="raised">No BG</sh-toggle>
    </ng-container>

    <app-button-sandbox
      [color]="color()"
      [variant]="variant()"
      [size]="size()"
      [rotated]="rotated()"
      [loading]="loading()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [noBg]="noBg()" />
  </app-previewer>
</div>

<h3>Variantions</h3>

<div class="content">
  <app-previewer path="/buttons/examples/base-button/base-button" title="Default" configName="button">
    <app-base-button class="example" />
  </app-previewer>

  <app-previewer path="/buttons/examples/simple-button/simple-button" title="Simple">
    <app-simple-button class="example" />
  </app-previewer>

  <app-previewer path="/buttons/examples/outlined-button/outlined-button" title="Outlined">
    <app-outlined-button class="example" />
  </app-previewer>

  <app-previewer path="/buttons/examples/flat-button/flat-button" title="Flat">
    <app-flat-button class="example" />
  </app-previewer>

  <app-previewer path="/buttons/examples/raised-button/raised-button" title="Raised">
    <app-raised-button class="example" />
  </app-previewer>
</div>
