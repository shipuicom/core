<div class="sandbox-example">
  <app-previewer path="/chips/examples/chip-sandbox/chip-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-toggle [(checked)]="small" color="primary" variant="raised">Small</sh-toggle>
      <sh-toggle [(checked)]="sharp" color="primary" variant="raised">Sharp</sh-toggle>
      <sh-toggle [(checked)]="dynamic" color="primary" variant="raised">Dynamic coloring</sh-toggle>
      <sh-toggle [(checked)]="noBg" color="primary" variant="raised">No BG</sh-toggle>

      @if (dynamic()) {
        <div>
          <p>It's not great at colors to light, we're working on a better css based color algorithm.</p>
          <br />
          <sh-color-picker
            [renderingType]="'hsl'"
            [showDarkColors]="true"
            [selectedColor]="selectedColor()"
            (currentColor)="currentColor.set($event)" />
        </div>
      } @else {
        <sh-button-group class="small" [(value)]="color">
          <button value="">Default</button>
          <button value="primary">Primary</button>
          <button value="accent">Accent</button>
          <button value="warn">Warn</button>
          <button value="error">Error</button>
          <button value="success">Success</button>
        </sh-button-group>

        <sh-button-group class="small" [(value)]="variant">
          <button value="">Default</button>
          <button value="simple">Simple</button>
          <button value="outlined">Outlined</button>
          <button value="flat" [disabled]="noBg()">Flat</button>
          <button value="raised" [disabled]="noBg()">Raised</button>
        </sh-button-group>
      }
    </ng-container>

    <app-chip-sandbox
      [color]="color()"
      [variant]="variant()"
      [size]="small() ? 'small' : ''"
      [sharp]="sharp()"
      [noBg]="noBg()"
      [dynamic]="dynamic()"
      [dynamicColor]="currentColor()?.hsl" />
  </app-previewer>
</div>

<h3>Selected state</h3>

<div class="content">
  <app-previewer path="/chips/examples/selected-chip/selected-chip" title="Filter chips (selectable + selected)">
    <app-selected-chip class="example" />
  </app-previewer>
</div>

<h3>Variations</h3>

<div class="content">
  <app-previewer path="/chips/examples/base-chip/base-chip" title="Default" configName="chip">
    <app-base-chip class="example" />
  </app-previewer>

  <app-previewer path="/chips/examples/simple-chip/simple-chip" title="Simple">
    <app-simple-chip class="example" />
  </app-previewer>

  <app-previewer path="/chips/examples/outlined-chip/outlined-chip" title="Outlined">
    <app-outlined-chip class="example" />
  </app-previewer>

  <app-previewer path="/chips/examples/flat-chip/flat-chip" title="Flat">
    <app-flat-chip class="example" />
  </app-previewer>

  <app-previewer path="/chips/examples/raised-chip/raised-chip" title="Raised">
    <app-raised-chip class="example" />
  </app-previewer>
</div>
