<div class="overview-blueprint">
  <sh-blueprint [autoLayout]="true" [(nodes)]="nodes" />
</div>

<app-highlight lang="html" [content]="basicCode" />

<app-property-viewer>
  <section>
    <h4>WIP Blueprints</h4>
    <p>
      ShipBlueprint renders a node-based canvas of draggable nodes with inputs, outputs, and
      connections. Toggle <code>autoLayout</code> to position nodes automatically, and use the
      <code>dots</code> class to switch the background grid to a dotted style. This component is a
      work in progress.
    </p>
  </section>
</app-property-viewer>
