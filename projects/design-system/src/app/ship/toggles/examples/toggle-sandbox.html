<sh-toggle [color]="color()" [variant]="variant()" [(checked)]="checked" [disabled]="disabled()" label="disabled toggle" />

<sh-toggle [color]="color()" [variant]="variant()" [(checked)]="checked" [disabled]="disabled()">
  Toggle with label
</sh-toggle>

<sh-toggle [color]="color()" [variant]="variant()">
  Toggle with ngModel
  <input type="checkbox" [(ngModel)]="checked" [disabled]="disabled()" />
</sh-toggle>

<sh-toggle [color]="color()" [variant]="variant()">
  Toggle with input reactive forms {{ formCtrl.value }}
  <input type="checkbox" [formControl]="formCtrl" />
</sh-toggle>

<sh-toggle [color]="color()" [variant]="variant()">
  Toggle with input signal forms {{ formFieldAsForm().value() }}
  <input type="checkbox" [formField]="formFieldAsForm" />
</sh-toggle>
