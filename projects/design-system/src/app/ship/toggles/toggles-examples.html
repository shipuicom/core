<div class="sandbox-example">
  <app-previewer path="/toggles/examples/toggle-sandbox/toggle-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-toggle [(checked)]="checked" color="primary" variant="raised">Checked</sh-toggle>
      <sh-toggle [(checked)]="disabled" color="primary" variant="raised">Disabled</sh-toggle>

      <sh-button-group class="small" [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-button-group class="small" [(value)]="variant">
        <button value="">Default</button>
        <button value="simple">Simple</button>
        <button value="outlined">Outlined</button>
        <button value="flat">Flat</button>
        <button value="raised">Raised</button>
      </sh-button-group>
    </ng-container>

    <app-toggle-sandbox [(checked)]="checked" [disabled]="disabled()" [color]="color()" [variant]="variant()" />
  </app-previewer>
</div>

<h3>Variations</h3>

<div class="content">
  <app-previewer path="/toggles/examples/base-toggle/base-toggle" title="Default" configName="toggle">
    <app-base-toggle class="example" />
  </app-previewer>

  <app-previewer path="/toggles/examples/simple-toggle/simple-toggle" title="Simple">
    <app-simple-toggle class="example" />
  </app-previewer>

  <app-previewer path="/toggles/examples/outlined-toggle/outlined-toggle" title="Outlined">
    <app-outlined-toggle class="example" />
  </app-previewer>

  <app-previewer path="/toggles/examples/flat-toggle/flat-toggle" title="Flat">
    <app-flat-toggle class="example" />
  </app-previewer>

  <app-previewer path="/toggles/examples/raised-toggle/raised-toggle" title="Raised">
    <app-raised-toggle class="example" />
  </app-previewer>

  <app-previewer path="/toggles/examples/signal-form-toggle/signal-form-toggle" title="Signal Forms">
    <app-signal-form-toggle class="example" />
  </app-previewer>
</div>
