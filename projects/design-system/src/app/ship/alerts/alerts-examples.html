<div class="sandbox-example">
  <app-previewer path="/alerts/examples/alerts-sandbox/alerts-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-button-group size="small" [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-button-group size="small" [(value)]="variant">
        <button value="">Default</button>
        <button value="simple">Simple</button>
        <button value="outlined">Outlined</button>
        <button value="flat">Flat</button>
        <button value="raised">Raised</button>
      </sh-button-group>
    </ng-container>

    <app-alerts-sandbox [color]="color()" [variant]="variant()" />
  </app-previewer>
</div>

<h3>Variations</h3>

<div class="content">
  <app-previewer path="/alerts/examples/base-alert/base-alert" title="Default" configName="alert">
    <app-base-alert class="example" />
  </app-previewer>
  <app-previewer path="/alerts/examples/simple-alert/simple-alert" title="Simple">
    <app-simple-alert class="example" />
  </app-previewer>
  <app-previewer path="/alerts/examples/outlined-alert/outlined-alert" title="Outlined">
    <app-outlined-alert class="example" />
  </app-previewer>
  <app-previewer path="/alerts/examples/flat-alert/flat-alert" title="Flat">
    <app-flat-alert class="example" />
  </app-previewer>
  <app-previewer path="/alerts/examples/raised-alert/raised-alert" title="Raised">
    <app-raised-alert class="example" />
  </app-previewer>
</div>
