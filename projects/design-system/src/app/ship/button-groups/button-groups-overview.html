<app-previewer defaultView="markup" path="/button-groups/examples/basic-button-group/basic-button-group" title="Basic">
  <app-basic-button-group class="example" />
</app-previewer>

<app-property-viewer>
  <section>
    <h4>Sizes</h4>
    <p>
      Use the
      <code>size</code>
      attribute to change the scale of the group, e.g.,
      <code>size="small"</code>
      .
    </p>
  </section>

  <section>
    <h4>Active State</h4>
    <p>
      Apply the
      <code>active</code>
      attribute or class to a button within the group to highlight it as the current selection.
    </p>
  </section>
</app-property-viewer>
