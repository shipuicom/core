<div class="sandbox-example">
  <app-previewer path="/sidenavs/examples/sandbox-sidenav/sandbox-sidenav" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-toggle [(checked)]="isNavOpen" class="primary raised">Open/Close</sh-toggle>

      <sh-button-group class="small" [(value)]="sidenavType">
        <button value="">Default</button>
        <button value="overlay">Overlay</button>
        <button value="simple">Simple</button>
      </sh-button-group>

      @if (sidenavType() === 'overlay') {
        <sh-toggle [(checked)]="disableDrag" class="primary raised">Disable Drag</sh-toggle>
      }
    </ng-container>

    <app-sandbox-sidenav [sidenavType]="sidenavType()" [(isNavOpen)]="isNavOpen" [disableDrag]="disableDrag()" />
  </app-previewer>
</div>

<div class="sandbox-example">
  <app-previewer path="/sidenavs/examples/default-sidenav/default-sidenav" title="Default" class="no-space">
    <app-default-sidenav />
  </app-previewer>
</div>

<div class="sandbox-example">
  <app-previewer path="/sidenavs/examples/simple-sidenav/simple-sidenav" title="Simple" class="no-space">
    <app-simple-sidenav />
  </app-previewer>
</div>

<div class="sandbox-example">
  <app-previewer path="/sidenavs/examples/overlay-sidenav/overlay-sidenav" title="Overlay" class="no-space">
    <app-overlay-sidenav />
  </app-previewer>
</div>
