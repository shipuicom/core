<div class="sandbox-example">
  <app-previewer path="/radio-buttons/examples/radio-sandbox/radio-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-toggle [(checked)]="disabled" color="primary" variant="raised">Disabled</sh-toggle>

      <sh-button-group class="small" [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-button-group class="small" [(value)]="variant">
        <button value="">Default</button>
        <button value="simple">Simple</button>
        <button value="outlined">Outlined</button>
        <button value="flat">Flat</button>
        <button value="raised">Raised</button>
      </sh-button-group>
    </ng-container>

    <app-radio-sandbox [disabled]="disabled()" [color]="color()" [variant]="variant()" />
  </app-previewer>
</div>

<h3>Variations</h3>

<div class="content">
  <app-previewer path="/radio-buttons/examples/base-radio/base-radio" title="Default" configName="radio">
    <app-base-radio class="example" />
  </app-previewer>
  <app-previewer path="/radio-buttons/examples/simple-radio/simple-radio" title="Simple">
    <app-simple-radio class="example" />
  </app-previewer>
  <app-previewer path="/radio-buttons/examples/outlined-radio/outlined-radio" title="Outlined">
    <app-outlined-radio class="example" />
  </app-previewer>
  <app-previewer path="/radio-buttons/examples/flat-radio/flat-radio" title="Flat">
    <app-flat-radio class="example" />
  </app-previewer>
  <app-previewer path="/radio-buttons/examples/raised-radio/raised-radio" title="Raised">
    <app-raised-radio class="example" />
  </app-previewer>

  <app-previewer path="/radio-buttons/examples/signal-form-radio/signal-form-radio" title="Signal Forms">
    <app-signal-form-radio class="example" />
  </app-previewer>
</div>
