<div class="content">
  <sh-spinner [style.--spinner-thickness]="thicknessAsPixels()" [style.--spinner-size]="sizeAsPixels()"></sh-spinner>
  <sh-spinner
    [style.--spinner-thickness]="thicknessAsPixels()"
    [style.--spinner-size]="sizeAsPixels()"
    color="primary"></sh-spinner>
  <sh-spinner
    [style.--spinner-thickness]="thicknessAsPixels()"
    [style.--spinner-size]="sizeAsPixels()"
    color="accent"></sh-spinner>
  <sh-spinner
    [style.--spinner-thickness]="thicknessAsPixels()"
    [style.--spinner-size]="sizeAsPixels()"
    color="warn"></sh-spinner>
  <sh-spinner
    [style.--spinner-thickness]="thicknessAsPixels()"
    [style.--spinner-size]="sizeAsPixels()"
    color="error"></sh-spinner>
  <sh-spinner
    [style.--spinner-thickness]="thicknessAsPixels()"
    [style.--spinner-size]="sizeAsPixels()"
    color="success"></sh-spinner>
</div>
