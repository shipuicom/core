<div class="sandbox-example">
  <app-previewer path="/datepickers/examples/datepicker-sandbox/datepicker-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-toggle class="raised primary" [(checked)]="disabled">Disabled</sh-toggle>
      <sh-toggle class="raised primary" [(checked)]="sharp">Sharp</sh-toggle>

      <sh-button-group [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-button-group [(value)]="startOfWeek">
        <button value="1">Monday</button>
        <button value="2">Tuesday</button>
        <button value="3">Wednesday</button>
        <button value="4">Thursday</button>
        <button value="5">Friday</button>
        <button value="6">Saturday</button>
        <button value="0">Sunday</button>
      </sh-button-group>
    </ng-container>

    <app-datepicker-sandbox
      class="example"
      [disabled]="disabled()"
      [sharp]="sharp()"
      [color]="color()"
      [startOfWeek]="+startOfWeek()" />
  </app-previewer>
</div>

<div class="sandbox-example">
  <app-previewer
    path="/datepickers/examples/range-datepicker-sandbox/range-datepicker-sandbox"
    title="Range Sandbox"
    class="no-space">
    <ng-container controls>
      <sh-toggle [(checked)]="rangeDisabled">Disabled</sh-toggle>

      <sh-button-group [(value)]="rangeColor">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-range-slider min="1" max="3">
        <label>Months to show</label>
        <input type="range" [(ngModel)]="monthsToShow" min="1" max="12" />
      </sh-range-slider>
    </ng-container>

    <app-range-datepicker-sandbox
      class="example"
      [disabled]="rangeDisabled()"
      [color]="rangeColor()"
      [monthsToShow]="monthsToShow()" />
  </app-previewer>
</div>

<app-previewer path="/datepickers/examples/base-datepicker/base-datepicker" title="Default" configName="datepicker">
  <app-base-datepicker class="example" />
</app-previewer>

<app-previewer path="/datepickers/examples/range-datepicker/range-datepicker" title="Range">
  <app-range-datepicker class="example" />
</app-previewer>

<app-previewer path="/datepickers/examples/input-datepicker-ngmodel/input-datepicker-ngmodel" title="Input (ngModel)">
  <app-input-datepicker-ngmodel class="example" />
</app-previewer>

<app-previewer
  path="/datepickers/examples/input-datepicker-reactive/input-datepicker-reactive"
  title="Input (Reactive Form)">
  <app-input-datepicker-reactive class="example" />
</app-previewer>

<app-previewer
  path="/datepickers/examples/input-datepicker-signal-form/input-datepicker-signal-form"
  title="Input (Signal Form)">
  <app-input-datepicker-signal-form class="example" />
</app-previewer>

<app-previewer path="/datepickers/examples/range-input-datepicker/range-input-datepicker" title="Range Input">
  <app-range-input-datepicker class="example" />
</app-previewer>

<app-previewer
  path="/datepickers/examples/live-updates-input-datepicker/live-updates-input-datepicker"
  title="Live External Updates">
  <app-live-updates-input-datepicker class="example" />
</app-previewer>
