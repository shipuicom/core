<div class="content">
  <sh-datepicker
    [class]="color()"
    [(date)]="startDate"
    [(endDate)]="endDate"
    [asRange]="true"
    [disabled]="disabled()"
    [monthsToShow]="monthsToShow()"></sh-datepicker>
  <p>Start: {{ startDate() | date: 'mediumDate' }}</p>
  <p>End: {{ endDate() | date: 'mediumDate' }}</p>
</div>
