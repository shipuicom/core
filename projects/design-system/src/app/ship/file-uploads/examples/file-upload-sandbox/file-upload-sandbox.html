<sh-file-upload
  [(files)]="files"
  [multiple]="multiple()"
  [accept]="accept()"
  [placeholder]="placeholder()"
  [overlayText]="overlayText()">
  <label>Upload files</label>
</sh-file-upload>

<div class="files-list">
  <h4>Selected Files</h4>
  <ul>
    @for (file of files(); track file.name) {
      <li>{{ file.name }}</li>
    }
  </ul>
</div>
