<div class="sandbox-example">
  <app-previewer path="/file-uploads/examples/file-upload-sandbox/file-upload-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-form-field>
        <label>Accept</label>
        <input type="text" [(ngModel)]="accept" />
      </sh-form-field>

      <sh-form-field>
        <label>Placeholder</label>
        <input type="text" [(ngModel)]="placeholder" />
      </sh-form-field>

      <sh-form-field>
        <label>Overlay Text</label>
        <input type="text" [(ngModel)]="overlayText" />
      </sh-form-field>

      <sh-checkbox class="primary raised" [(checked)]="multiple">Multiple</sh-checkbox>
    </ng-container>

    <app-file-upload-sandbox
      [multiple]="multiple()"
      [accept]="accept()"
      [placeholder]="placeholder()"
      [overlayText]="overlayText()" />
  </app-previewer>
</div>

<div class="content">
  <app-previewer path="/file-uploads/examples/base-file-upload/base-file-upload" title="Default">
    <app-base-file-upload class="example" />
  </app-previewer>
</div>

<p>More variants to come</p>
