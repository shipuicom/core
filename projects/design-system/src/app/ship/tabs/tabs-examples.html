<div class="sandbox-example">
  <app-previewer path="/tabs/examples/tabs-sandbox/tabs-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-button-group class="small" [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>
    </ng-container>

    <app-tabs-sandbox [color]="color()" />
  </app-previewer>
</div>

<div class="content">
  <h3>Variations</h3>

  <app-previewer path="/tabs/examples/default-tabs/default-tabs" title="Default Tabs as buttons">
    <app-default-tabs />
  </app-previewer>

  <app-previewer path="/tabs/examples/custom-tabs/custom-tabs" title="Custom div element as Tabs">
    <app-custom-tabs />
  </app-previewer>

  <app-previewer class="align-start" path="/tabs/examples/router-tabs/router-tabs" title="Router Tabs">
    <app-router-tabs />

    <router-outlet></router-outlet>
  </app-previewer>
</div>
