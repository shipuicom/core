<sh-card>
  <sh-lo-empty-state [variant]="variant()">
    <sh-icon>folder-dashed</sh-icon>
    <h3>No projects yet</h3>
    <p>Projects group your reports, dashboards and teammates. Create the first one to get started.</p>
    <button shButton variant="outlined">Import</button>
    <button shButton variant="raised" color="primary">
      <sh-icon>plus</sh-icon>
      New project
    </button>
  </sh-lo-empty-state>
</sh-card>
