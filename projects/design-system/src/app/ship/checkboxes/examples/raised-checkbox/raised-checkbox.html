<sh-checkbox [(checked)]="active" variant="raised" label="raised checkbox" />
<sh-checkbox [(checked)]="active" variant="raised" color="primary" label="Primary raised checkbox" />
<sh-checkbox [(checked)]="active" variant="raised" color="accent" label="Accent raised checkbox" />
<sh-checkbox [(checked)]="active" variant="raised" color="warn" label="Warn raised checkbox" />
<sh-checkbox [(checked)]="active" variant="raised" color="error" label="Error raised checkbox" />
<sh-checkbox [(checked)]="active" variant="raised" color="success" label="Success raised checkbox" />
<sh-checkbox [(checked)]="active" variant="raised" [disabled]="true" label="disabled raised checkbox" />

<sh-checkbox variant="raised" color="primary">
  Checkbox with ngModel
  <input type="checkbox" [(ngModel)]="active" />
</sh-checkbox>

<sh-checkbox variant="raised" color="primary">
  Checkbox with input reactive forms {{ formCtrl.value }}
  <input type="checkbox" [formControl]="formCtrl" />
</sh-checkbox>
