<div class="sandbox-example">
  <app-previewer path="/checkboxes/examples/checkbox-sandbox/checkbox-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-toggle [(checked)]="checked" color="primary" variant="raised">Checked</sh-toggle>
      <sh-toggle [(checked)]="indeterminate" color="primary" variant="raised">Indeterminate</sh-toggle>
      <sh-toggle [(checked)]="disabled" color="primary" variant="raised">Disabled</sh-toggle>

      <sh-button-group class="small" [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-button-group class="small" [(value)]="variant">
        <button value="">Default</button>
        <button value="simple">Simple</button>
        <button value="outlined">Outlined</button>
        <button value="flat">Flat</button>
        <button value="raised">Raised</button>
      </sh-button-group>
    </ng-container>

    <app-checkbox-sandbox
      [(checked)]="checked"
      [indeterminate]="indeterminate()"
      [disabled]="disabled()"
      [color]="color()"
      [variant]="variant()" />
  </app-previewer>
</div>

<h3>Variations</h3>

<div class="content">
  <app-previewer path="/checkboxes/examples/base-checkbox/base-checkbox" title="Default" configName="checkbox">
    <app-base-checkbox class="example" />
  </app-previewer>

  <app-previewer path="/checkboxes/examples/simple-checkbox/simple-checkbox" title="Simple">
    <app-simple-checkbox class="example" />
  </app-previewer>

  <app-previewer path="/checkboxes/examples/outlined-checkbox/outlined-checkbox" title="Outlined">
    <app-outlined-checkbox class="example" />
  </app-previewer>

  <app-previewer path="/checkboxes/examples/flat-checkbox/flat-checkbox" title="Flat">
    <app-flat-checkbox class="example" />
  </app-previewer>

  <app-previewer path="/checkboxes/examples/raised-checkbox/raised-checkbox" title="Raised">
    <app-raised-checkbox class="example" />
  </app-previewer>

  <app-previewer path="/checkboxes/examples/signal-form-checkbox/signal-form-checkbox" title="Signal Forms">
    <app-signal-form-checkbox class="example" />
  </app-previewer>
</div>
