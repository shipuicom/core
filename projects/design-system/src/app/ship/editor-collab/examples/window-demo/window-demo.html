<div class="window-demo">
  <div class="collab-toolbar">
    <button shButton class="primary raised small" (click)="openWindow()">Open second window</button>
    <sh-toggle class="primary" [checked]="fuzzer.running()" (checkedChange)="toggle($event)" label="Fuzz">
      Fuzz
    </sh-toggle>
    @if (fuzzer.running()) {
      <sh-chip class="sharp xsmall checksum">ops {{ fuzzer.ops() }}</sh-chip>
    }
    <sh-chip class="sharp xsmall" [style.border-color]="me.color">
      <span class="dot" [style.background]="me.color"></span>
      {{ me.name }}
    </sh-chip>
    @for (peer of peers(); track peer.clientId) {
      <sh-chip class="sharp xsmall">
        <span class="dot" [style.background]="peer.color"></span>
        {{ peer.name }}
      </sh-chip>
    }
    <sh-chip class="sharp xsmall checksum">doc {{ checksum() }}</sh-chip>
  </div>
  <sh-editor
    shCollab="ship-docs-window"
    [presence]="me"
    [value]="initialHtml"
    format="html"
    [multiCursor]="false"
    [readonly]="fuzzer.running()" />
</div>
