<sh-list class="primary">
  <h3 title>Today</h3>
  @for (todo of todos(); track todo.id) {
    <button (click)="toggle(todo.id)" [class.done]="todo.done">
      <sh-checkbox class="primary" [label]="todo.title">
        <input type="checkbox" [ngModel]="todo.done" />
      </sh-checkbox>
      <span class="title">{{ todo.title }}</span>
    </button>
  }
</sh-list>

<p class="selected-value">
  Completed:
  <code>{{ doneCount() }}/{{ todos().length }}</code>
</p>
