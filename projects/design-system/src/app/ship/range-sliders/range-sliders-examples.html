<div class="sandbox-example">
  <app-previewer
    path="/range-sliders/examples/range-slider-sandbox/range-slider-sandbox"
    title="Sandbox"
    class="no-space">
    <ng-container controls>
      <sh-toggle class="primary raised" [(checked)]="disabled">Disabled</sh-toggle>
      <sh-toggle class="primary raised" [(checked)]="readonly">Read-only</sh-toggle>
      @if (variant() !== 'thick') {
        <sh-toggle class="primary raised" [(checked)]="alwaysShow">Always show value indicator</sh-toggle>
      }
      <sh-toggle class="primary raised" [(checked)]="sharp">Sharp</sh-toggle>

      <sh-button-group [(value)]="color">
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>

      <sh-button-group [(value)]="variant">
        <button value="base">Default</button>
        <button value="simple">Simple</button>
        <button value="outlined">Outlined</button>
        <button value="flat">Flat</button>
        <button value="raised">Raised</button>
      </sh-button-group>

      <sh-form-field>
        <label>Unit</label>
        <input type="text" [(ngModel)]="unit" />
      </sh-form-field>

      <sh-form-field>
        <label>Min</label>
        <input type="text" [(ngModel)]="min" />
      </sh-form-field>

      <sh-form-field>
        <label>Max</label>
        <input type="text" [(ngModel)]="max" />
      </sh-form-field>

      <sh-form-field>
        <label>Step</label>
        <input type="text" [(ngModel)]="step" />
      </sh-form-field>
    </ng-container>

    <app-range-slider-sandbox
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [disabled]="disabled()"
      [readonly]="readonly()"
      [alwaysShow]="alwaysShow()"
      [sharp]="sharp()"
      [unit]="unit()"
      [color]="color()"
      [variant]="variant()" />
  </app-previewer>
</div>

<app-previewer path="/range-sliders/examples/base-range-slider/base-range-slider" title="Default">
  <app-base-range-slider class="example" />
</app-previewer>

<app-previewer path="/range-sliders/examples/float-range-slider/float-range-slider" title="Float">
  <app-float-range-slider class="example" />
</app-previewer>

<app-previewer path="/range-sliders/examples/reactive-range-slider/reactive-range-slider" title="Reactive Form">
  <app-reactive-range-slider class="example" />
</app-previewer>

<app-previewer path="/range-sliders/examples/signal-form-range-slider/signal-form-range-slider" title="Signal Form">
  <app-signal-form-range-slider class="example" />
</app-previewer>

<app-previewer path="/range-sliders/examples/readonly-range-slider/readonly-range-slider" title="Readonly">
  <app-readonly-range-slider class="example" />
</app-previewer>

<app-previewer path="/range-sliders/examples/unit-range-slider/unit-range-slider" title="Unit">
  <app-unit-range-slider class="example" />
</app-previewer>

<app-previewer
  path="/range-sliders/examples/always-show-indicator-range-slider/always-show-indicator-range-slider"
  title="Always Show Indicator">
  <app-always-show-indicator-range-slider class="example" />
</app-previewer>

<app-previewer path="/range-sliders/examples/disabled-range-slider/disabled-range-slider" title="Disabled">
  <app-disabled-range-slider class="example" />
</app-previewer>

<app-previewer
  path="/range-sliders/examples/live-updates-range-slider/live-updates-range-slider"
  title="Live External Updates">
  <app-live-updates-range-slider class="example" />
</app-previewer>
