<sh-range-slider
  [unit]="unit()"
  [color]="color()"
  [variant]="variant()"
  [sharp]="sharp()"
  [alwaysShow]="alwaysShow()">
  <label>Sandbox value</label>
  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [(ngModel)]="value"
    [disabled]="disabled()"
    [readonly]="readonly()" />
</sh-range-slider>
<p>Selected: {{ value() }}</p>
