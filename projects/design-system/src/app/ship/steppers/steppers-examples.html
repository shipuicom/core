<div class="sandbox-example">
  <app-previewer path="/steppers/examples/stepper-sandbox/stepper-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-button-group class="small" [(value)]="color">
        <button value="">Default</button>
        <button value="primary">Primary</button>
        <button value="accent">Accent</button>
        <button value="warn">Warn</button>
        <button value="error">Error</button>
        <button value="success">Success</button>
      </sh-button-group>
    </ng-container>

    <app-stepper-sandbox [color]="color()" />
  </app-previewer>
</div>

<div class="content">
  <h3>Variations</h3>

  <app-previewer path="/steppers/examples/default-stepper/default-stepper" title="Default Stepper">
    <app-default-steppers />
  </app-previewer>

  <app-previewer path="/steppers/examples/custom-stepper/custom-stepper" title="Custom Stepper">
    <app-custom-steppers />
  </app-previewer>

  <app-previewer path="/steppers/examples/router-stepper/router-stepper" title="Router Stepper">
    <app-router-steppers />
    <router-outlet></router-outlet>
  </app-previewer>
</div>
