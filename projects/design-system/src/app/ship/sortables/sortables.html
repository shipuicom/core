<h1>Sortable</h1>
<!-- @keywords: sortable, drag and drop, list, ordering, dnd, draggable, cross list, touch, mobile, long press -->

<sh-alert color="primary" class="touch-hint">
  <sh-icon>hand-pointing</sh-icon>
  On a phone or tablet, long-press an item to pick it up, then drag it into place. A quick swipe still scrolls.
</sh-alert>

<sh-tabs color="primary">
  <button routerLink="/sortables" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</button>
  <button routerLink="/sortables/api" routerLinkActive="active">API</button>
  <button routerLink="/sortables/service" routerLinkActive="active">Service</button>
  <button routerLink="/sortables/styling" routerLinkActive="active">Styling</button>
  <button routerLink="/sortables/examples" routerLinkActive="active">Examples</button>
</sh-tabs>

<div class="tab-content" style="margin-top: 24px">
  <router-outlet />
</div>
