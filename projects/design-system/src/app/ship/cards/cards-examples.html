<div class="sandbox-example">
  <app-previewer path="/cards/examples/card-sandbox/card-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-button-group class="small" [(value)]="variant">
        <button value="type-a">Type A</button>
        <button value="type-b">Type B</button>
        <button value="type-c">Type C</button>
        <button value="type-d">Type D</button>
      </sh-button-group>

      <sh-toggle [(checked)]="disableToggle" color="primary" variant="raised">Disable Toggle</sh-toggle>
    </ng-container>

    <app-card-sandbox [variant]="variant()" [disableToggle]="disableToggle()" />
  </app-previewer>
</div>

<div class="content">
  <h3>Variations</h3>

  <app-previewer path="/cards/examples/base-card/base-card" title="Default">
    <app-base-card />
  </app-previewer>

  <app-previewer path="/cards/examples/type-a-card/type-a-card" title="Type A">
    <app-type-a-card />
  </app-previewer>

  <app-previewer path="/cards/examples/type-b-card/type-b-card" title="Type B">
    <app-type-b-card />
  </app-previewer>

  <app-previewer path="/cards/examples/type-c-card/type-c-card" title="Type C">
    <app-type-c-card />
  </app-previewer>

  <app-previewer path="/cards/examples/type-d-card/type-d-card" title="Type D">
    <app-type-d-card />
  </app-previewer>

  <app-previewer path="/cards/examples/toggle-card/toggle-card" title="Toggle Card">
    <app-toggle-card-example />
  </app-previewer>

  <app-previewer
    path="/cards/examples/toggle-card-disallowed/toggle-card-disallowed"
    title="Toggle Card (disableToggle)">
    <app-toggle-card-disallowed-example />
  </app-previewer>
</div>
