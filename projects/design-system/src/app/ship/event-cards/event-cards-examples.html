<div class="sandbox-example">
  <app-previewer path="/event-cards/examples/event-card-sandbox/event-card-sandbox" title="Sandbox" class="no-space">
    <ng-container controls>
      <sh-toggle [(checked)]="useDynamicColor" color="primary" variant="raised">Use dynamic color</sh-toggle>

      @if (useDynamicColor()) {
        <input type="color" [ngModel]="dynamicColor()" (ngModelChange)="dynamicColor.set($event)" />
      } @else {
        <sh-button-group class="small" [(value)]="color">
          <button value="">Default</button>
          <button value="primary">Primary</button>
          <button value="accent">Accent</button>
          <button value="warn">Warn</button>
          <button value="error">Error</button>
          <button value="success">Success</button>
        </sh-button-group>

        <sh-button-group class="small" [(value)]="variant">
          <button value="">Default</button>
          <button value="simple">Simple</button>
          <button value="outlined">Outlined</button>
          <button value="flat">Flat</button>
          <button value="raised">Raised</button>
        </sh-button-group>
      }
    </ng-container>

    <app-event-card-sandbox
      [color]="color()"
      [variant]="variant()"
      [useDynamicColor]="useDynamicColor()"
      [dynamicColor]="dynamicColor()" />
  </app-previewer>
</div>

<h3>Variations</h3>

<div class="content">
  <app-previewer path="/event-cards/examples/base-event-card/base-event-card" title="Default">
    <app-base-event-card class="example" />
  </app-previewer>

  <app-previewer path="/event-cards/examples/simple-event-card/simple-event-card" title="Simple">
    <app-simple-event-card class="example" />
  </app-previewer>

  <app-previewer path="/event-cards/examples/outlined-event-card/outlined-event-card" title="Outlined">
    <app-outlined-event-card class="example" />
  </app-previewer>

  <app-previewer path="/event-cards/examples/flat-event-card/flat-event-card" title="Flat">
    <app-flat-event-card class="example" />
  </app-previewer>

  <app-previewer path="/event-cards/examples/raised-event-card/raised-event-card" title="Raised">
    <app-raised-event-card class="example" />
  </app-previewer>
</div>
