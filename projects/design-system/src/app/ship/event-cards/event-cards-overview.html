<app-previewer defaultView="markup" path="/event-cards/examples/basic-event-card/basic-event-card" title="Basic">
  <app-basic-event-card class="example" />
</app-previewer>

<app-property-viewer>
  <section>
    <h4>Variants</h4>
    <p>
      Event card variants can be set using the
      <code>variant</code>
      attribute. Valid options are:
      <b>simple</b>
      ,
      <b>outlined</b>
      ,
      <b>flat</b>
      , and
      <b>raised</b>
      .
    </p>
  </section>

  <section>
    <h4>Colors</h4>
    <p>
      Colors can be set using the
      <code>color</code>
      attribute. Valid options are:
      <b>primary</b>
      ,
      <b>accent</b>
      ,
      <b>warn</b>
      ,
      <b>error</b>
      , and
      <b>success</b>
      .
    </p>
  </section>
</app-property-viewer>
