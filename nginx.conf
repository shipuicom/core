server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed build artifacts never change — cache forever.
    location ~* \.(?:js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every docs route is prerendered to <route>/index.html by the SSG build,
    # so deep links resolve to their own page; anything unknown falls back to
    # the app shell (index.csr.html boots the client router) and redirects.
    location / {
        try_files $uri $uri/index.html $uri/ /index.csr.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
